name = "uib-hub-submit"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Адрес сайта на GitHub Pages, без слеша в конце (только с него форма может отправлять работы)
ALLOWED_ORIGIN = "https://ibrahimtooru-ship-it.github.io"
# Группа «UIB Hub Moders». Если Telegram превратит её в супергруппу, id сменится на -100… — обнови и сделай deploy
MODERATOR_CHAT_ID = "-5555368205"
# Репозиторий сайта и путь к базе знаний внутри него
GITHUB_REPO = "ibrahimtooru-ship-it/uib-hub"
GITHUB_BRANCH = "main"
MATERIALS_PATH = "data/materials.json"

[[kv_namespaces]]
binding = "SUBMISSIONS"
# Создано командой: npx wrangler kv namespace create SUBMISSIONS
id = "6aff2b309b95448098eff2b7d844f6df"
